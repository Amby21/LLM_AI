version: "3.9"

services:
  datadialogue:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist both databases between container restarts
      - ./sample.db:/app/sample.db
      - ./datadialogue.db:/app/datadialogue.db
      - ./mlflow:/app/mlflow
    restart: unless-stopped